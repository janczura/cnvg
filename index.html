<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Castle Nathria VIP Guest</title>
<!-- The guild's page on GitHub Pages. Data: guild.js (window.GUILD) - pushed by GuildManager every minute
     when something changed. It's a script, not a .json, so the page also works opened straight from disk. -->
<style>
:root {
  color-scheme: dark;
  --bg: #12110f; --surface: #1b1916; --surface-2: #24211c; --line: #322e27; --line-2: #463f34;
  --text: #ede6d6; --muted: #9a9284; --accent: #e3b341; --radius: 8px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
header { border-top: 3px solid var(--accent); border-bottom: 1px solid var(--line); background: var(--surface); }
header div, main { max-width: 1000px; margin: 0 auto; padding: 16px; }
header div { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.discord { padding: 6px 14px; border-radius: 6px; background: #5865f2; color: #fff; font-weight: 600; text-decoration: none; }
.discord:hover { background: #4752c4; }
.discord:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1 { margin: 0; font-size: 22px; }
h2 { font-size: 17px; margin: 32px 0 12px; }
.muted { color: var(--muted); }
.panel { padding: 14px 16px; margin-bottom: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.panel h3 { margin: 0; font-size: 16px; }
.when { color: var(--accent); font-size: 14px; }
.desc { white-space: pre-wrap; margin: 8px 0 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
.cols ul { margin: 4px 0 0; padding-left: 18px; }
summary { cursor: pointer; color: var(--muted); }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 7px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
thead th { background: var(--surface-2); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
tbody tr:last-child > * { border-bottom: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.tag { font-size: 10px; font-weight: 600; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; margin-left: 4px;
  background: var(--surface-2); border: 1px solid var(--line-2); color: var(--muted); vertical-align: 1px; }
.c-Warrior { color: #c69b6d; } .c-Paladin { color: #f48cba; } .c-Hunter { color: #aad372; } .c-Rogue { color: #fff468; }
.c-Priest { color: #ffffff; } .c-Shaman { color: #0070dd; } .c-Mage { color: #3fc7eb; } .c-Warlock { color: #8788ee; } .c-Druid { color: #ff7c0a; }
</style>
</head>
<body>
<header><div><h1>Guild</h1><a id="discord" class="discord" hidden>Join us on Discord</a></div></header>
<main id="app"><p class="muted">Loading…</p></main>
<script>
// Names come from Discord: everything from the data goes through esc().
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const ROLES = { tank: 'Tank', heal: 'Heal', dps: 'DPS' };
const STATUS = [['yes', 'Going'], ['maybe', 'Maybe'], ['no', 'Not going']];
const date = t => new Date(t * 1000).toLocaleString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
const character = (name, cls) => `<span class="c-${esc(cls)}">${esc(name)}</span>`;
const who = s => esc(s.player) + (s.character ? ` · ${character(s.character, s.class)}` : '') + (s.role ? `<span class="tag">${ROLES[s.role] ?? ''}</span>` : '');

function render({ events, characters, discord }) {
  if (discord) Object.assign(document.getElementById('discord'), { href: discord, hidden: false });
  const now = Date.now() / 1000;
  const upcoming = events.filter(e => e.startsAt >= now), past = events.filter(e => e.startsAt < now).reverse();
  const card = e => {
    const yes = e.signups.filter(s => s.status === 'yes');
    return `<div class="panel">
      <h3>${esc(e.title)}</h3><div class="when">${date(e.startsAt)}</div>
      ${e.description ? `<p class="desc">${esc(e.description)}</p>` : ''}
      <div class="cols">${STATUS.map(([status, label]) => {
        const list = e.signups.filter(s => s.status === status);
        return `<div><b>${label} (${list.length})</b><ul>${list.map(s => `<li>${who(s)}</li>`).join('')}</ul></div>`;
      }).join('')}</div>
      ${yes.length ? `<p class="muted" style="margin: 6px 0 0">${['tank', 'heal', 'dps'].map(r => `${ROLES[r]} ${yes.filter(s => s.role === r).length}`).join(' · ')}</p>` : ''}
    </div>`;
  };
  document.getElementById('app').innerHTML = `
    <h2>Upcoming events</h2>
    ${upcoming.map(card).join('') || '<p class="muted">No events planned.</p>'}
    <p class="muted">Sign up on Discord, with the buttons under the event's post.</p>
    <h2>Characters</h2>
    <div class="table-wrap"><table>
      <thead><tr><th class="num">#</th><th>Character</th><th>Class</th><th>Role</th><th>Professions</th><th class="num">HK</th><th>Player</th></tr></thead>
      <tbody>${characters.map((c, i) => `<tr><td class="num muted">${i + 1}</td>
        <td>${c.main ? `<b>${character(c.name, c.class)}</b><span class="tag">main</span>` : character(c.name, c.class)}</td>
        <td>${esc(c.class)}</td><td>${ROLES[c.role] ?? ''}</td><td>${esc(c.professions)}</td><td class="num">${Number(c.hk)}</td><td>${esc(c.player)}</td></tr>`).join('')
        || '<tr><td colspan="7" class="muted">No one has added a character yet (on Discord: /character add).</td></tr>'}</tbody>
    </table></div>
    ${past.length ? `<h2>Past events</h2><details><summary>Show (${past.length})</summary><div style="margin-top: 10px">${past.map(card).join('')}</div></details>` : ''}`;
}

// Loaded by hand with a query string: GitHub Pages lets browsers cache files for 10 minutes.
const script = document.createElement('script');
script.src = 'guild.js?' + Date.now();
script.onload = () => render(window.GUILD);
script.onerror = () => { document.getElementById('app').innerHTML = '<p class="muted">No data (guild.js).</p>'; };
document.head.append(script);
</script>
</body>
</html>
